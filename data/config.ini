; XsureZrcnmve 3.0 玩家设置
; 位置：data/config.ini（运行时玩家数据，与全局 manifest.json 分离）
; 编码：UTF-8；分号 ; 起始为注释
; 对应 3.0 优化项：XTO 等待时间修正、配音缺失不计资源缺失

[audio]
; 主音量，0-100
volume = 80
; 背景音乐音量，0-100
bgm_volume = 70
; 音效 / 配音音量，0-100
sound_volume = 85

[story]
; 跳过已读文本：1 = 开启，0 = 关闭
skip_read = 1

[xto]
; XTO 自动选择前的等待时间（毫秒）。3.0 优化项：等待时间修正。
; 优先级：剧情节点 xto.wait_ms > 此处全局默认 > 内置默认 1500
wait_ms = 1500
; 是否默认启用 XTO 自动选择：1 = 开启，0 = 关闭
; 仅控制全局开关；具体策略由剧情节点自身 xto 配置给出，前端不替剧情决策
enabled = 0

[assets]
; 3.0 优化项：配音（voice）缺失不计入资源缺失。
; 1 = 缺失配音时静默降级，不报资源缺失；0 = 严格校验
voice_missing_is_not_asset_missing = 1
