<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>邪冥 · 几何切割风 3D 查看器</title>
<style>
  html,body{margin:0;height:100%;background:#15171c;color:#e8e8ee;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  #hud{position:fixed;left:16px;top:14px;z-index:10;max-width:340px;pointer-events:none}
  #hud h1{font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:.5px}
  #hud p{font-size:12px;margin:2px 0;color:#9aa0ad}
  #tip{position:fixed;right:16px;bottom:14px;z-index:10;font-size:12px;color:#7d8493;pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#9aa0ad;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>邪冥 · 几何切割风</h1>
  <p>程序化低多边形二次元角色 · 21 骨人形骨架（可动）</p>
  <p>黑发 / 黑白格纹围巾 / 白衬衫 / 黑西装 · 冷调忧郁气质</p>
</div>
<div id="tip">拖拽旋转 · 滚轮缩放 · 右键平移</div>
<div id="loading">正在加载模型…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.05, 100);
camera.position.set(0.6, 1.45, 2.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.minDistance = 0.6;
controls.maxDistance = 8;

// lights (studio-ish, matches the Blender render mood)
scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x202028, 0.9));
const key = new THREE.DirectionalLight(0xfff2e6, 2.2); key.position.set(-1.5,2.5,2); scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb6ff, 0.8); fill.position.set(2,1,1.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0,2,-3); scene.add(rim);

const loader = new GLTFLoader();
loader.load('xieming_geo.glb', (gltf)=>{
  const m = gltf.scene;
  m.scale.set(1,1,1);
  scene.add(m);
  document.getElementById('loading').style.display='none';
  // frame
  const box = new THREE.Box3().setFromObject(m);
  const c = box.getCenter(new THREE.Vector3());
  controls.target.copy(c); controls.update();
}, undefined, (e)=>{
  document.getElementById('loading').textContent='模型加载失败：'+e.message;
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
function loop(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
