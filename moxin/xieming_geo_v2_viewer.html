<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邪冥 · 几何主角查看器 (xieming_geo_v2.glb)</title>
<style>
  html,body{margin:0;height:100%;background:#15171c;color:#e6e6e6;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  #bar{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;gap:10px;align-items:center;
       background:linear-gradient(#000a,#0000);z-index:10;flex-wrap:wrap}
  #bar h1{font-size:14px;margin:0 12px 0 0;font-weight:600;letter-spacing:.5px}
  button,label.btn{background:#2b6cb0;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button.sec{background:#3a3f4b}
  label.btn input{display:none}
  #hint{font-size:12px;opacity:.7}
  #status{position:fixed;bottom:10px;left:14px;font-size:12px;opacity:.6;z-index:10}
  canvas{display:block}
</style>
</head>
<body>
<div id="bar">
  <h1>邪冥 · 几何主角</h1>
  <label class="btn">选择模型文件<input id="file" type="file" accept=".glb,.vrm"></label>
  <button id="spin" class="sec">自动旋转：开</button>
  <button id="reset" class="sec">重置视角</button>
  <span id="hint">默认载入 xieming_geo_v2.glb（需与网页同目录）；或点“选择模型文件”加载本地文件</span>
</div>
<div id="app"></div>
<div id="status">初始化中…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-vrm": "https://cdn.jsdelivr.net/npm/three-vrm@2.1.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'three-vrm';

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.05, 100);
camera.position.set(0, 1.4, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.2, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(2,4,3); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.7); rim.position.set(-3,2,-2); scene.add(rim);
const grid = new THREE.GridHelper(10, 20, 0x335, 0x223); scene.add(grid);

let current = null, vrm = null, clock = new THREE.Clock();
let autoSpin = true;

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

function clearModel(){
  if (current){ scene.remove(current); current = null; }
  vrm = null;
}

function loadURL(url, label){
  statusEl.textContent = '载入中：' + (label || url);
  loader.load(url, (gltf) => {
    clearModel();
    const root = gltf.scene || gltf.scenes[0];
    vrm = gltf.userData.vrm || null;
    if (vrm){ VRMUtils.rotateVRM0(vrm); }
    current = root;
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    controls.target.copy(center);
    camera.position.set(center.x, center.y + size.y*0.15, center.z + Math.max(size.x,size.y,size.z)*1.6);
    controls.update();
    statusEl.textContent = '已载入：' + (label || url) + (vrm ? '（VRM · 含 SpringBone 动画）' : '（GLB）');
  }, undefined, (err) => {
    statusEl.textContent = '载入失败：' + err.message + '（若是本地 file:// 直接打开，请改用“选择模型文件”）';
  });
}

document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  loadURL(URL.createObjectURL(f), f.name);
});
document.getElementById('spin').addEventListener('click', (e) => {
  autoSpin = !autoSpin; e.target.textContent = '自动旋转：' + (autoSpin ? '开' : '关');
});
document.getElementById('reset').addEventListener('click', () => {
  if (current){ const box=new THREE.Box3().setFromObject(current); const c=box.getCenter(new THREE.Vector3()); const s=box.getSize(new THREE.Vector3());
    controls.target.copy(c); camera.position.set(c.x, c.y+s.y*0.15, c.z+Math.max(s.x,s.y,s.z)*1.6); controls.update(); }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (vrm && vrm.update) vrm.update(dt);
  if (autoSpin && current) current.rotation.y += dt * 0.4;
  controls.update();
  renderer.render(scene, camera);
}
animate();

loadURL('xieming_geo_v2.glb', 'xieming_geo_v2.glb');
</script>
</body>
</html>
